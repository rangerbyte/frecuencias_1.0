<title>Radio de Campo · Canales y Frecuencias CyL</title>
<style>
  :root{
    --bg:#0F1A13;
    --panel:#1B2B20;
    --panel-2:#22352A;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --text:#EDEAD9;
    --text-dim:#93A68C;
    --text-dim-2:#6C7C68;
    --amber:#FFB302;
    --amber-dim: rgba(255,179,2,0.16);
    --sky:#5AC0E0;
    --sky-dim: rgba(90,192,224,0.16);
    --danger:#FF7A55;
    --danger-dim: rgba(255,122,85,0.14);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --mono: "SF Mono","Cascadia Mono","Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
    --cond: Arial, Helvetica, sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(120% 140% at 50% -10%, #17261B 0%, var(--bg) 55%);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  .app{
    max-width:480px;
    margin:0 auto;
    padding:18px 16px 40px;
  }

  /* Header */
  .app-header{padding:6px 2px 16px; text-align:center;}
  .eyebrow{
    font-family:var(--cond); font-stretch:condensed;
    font-size:11px; letter-spacing:.14em; color:var(--text-dim-2);
    text-transform:uppercase; font-weight:700;
  }
  .app-header h1{
    margin:6px 0 2px;
    font-family:var(--cond); font-stretch:condensed;
    font-weight:800; text-transform:uppercase; letter-spacing:.03em;
    font-size:30px; color:var(--text);
  }
  .app-header h1 span{color:var(--amber);}
  .subtitle{margin:0; font-size:13px; color:var(--text-dim);}

  /* Tabs */
  .tabs{
    position:relative;
    display:flex; gap:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:4px;
    margin:14px 0 12px;
  }
  .tab-indicator{
    position:absolute; top:4px; bottom:4px; left:4px;
    width:calc(50% - 4px);
    border-radius:var(--radius-sm);
    background:var(--amber);
    transition:transform .28s cubic-bezier(.4,0,.2,1), background-color .28s;
    z-index:0;
  }
  .tab{
    position:relative; z-index:1;
    flex:1; border:none; background:transparent;
    padding:11px 6px;
    font-family:var(--cond); font-stretch:condensed;
    font-weight:800; letter-spacing:.06em; font-size:13px;
    text-transform:uppercase; color:var(--text-dim); cursor:pointer;
    transition:color .25s;
  }
  .tab.active{color:#0F1A13;}

  /* Search */
  .search-wrap{margin-bottom:10px;}
  #searchInput{
    width:100%; padding:11px 14px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-md); color:var(--text);
    font-size:14px;
  }
  #searchInput::placeholder{color:var(--text-dim-2);}

  /* Chips */
  .chips-scroll{
    display:flex; gap:8px; overflow-x:auto;
    padding:2px 2px 12px; scroll-snap-type:x proximity;
  }
  .chips-scroll::-webkit-scrollbar{display:none;}
  .prov-chip{
    scroll-snap-align:start;
    flex:0 0 auto;
    border:1px solid var(--line-strong);
    background:var(--panel);
    color:var(--text-dim);
    padding:8px 14px;
    border-radius:999px;
    font-size:13px; font-weight:600;
    cursor:pointer; white-space:nowrap;
    display:flex; align-items:center; gap:6px;
    transition:all .18s;
  }
  .prov-chip .home-dot{color:var(--amber); font-size:10px;}
  .prov-chip.selected.fm{background:var(--amber-dim); border-color:var(--amber); color:var(--amber);}
  .prov-chip.selected.am{background:var(--sky-dim); border-color:var(--sky); color:var(--sky);}

  /* Display panel — signature LCD radio readout */
  .display-panel{
    position:relative; overflow:hidden;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line-strong);
    border-radius:var(--radius-lg);
    box-shadow: inset 0 2px 14px rgba(0,0,0,0.55), 0 8px 24px rgba(0,0,0,0.25);
    padding:18px 18px 8px;
    margin-bottom:20px;
  }
  .display-panel::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }
  .display-header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:12px; position:relative; z-index:1;
  }
  .display-province{
    font-family:var(--cond); font-stretch:condensed;
    font-size:22px; font-weight:800; letter-spacing:.03em;
    text-transform:uppercase;
  }
  .display-band{
    font-family:var(--mono); font-size:11px; letter-spacing:.08em;
    padding:3px 8px; border-radius:999px; border:1px solid var(--line-strong);
    color:var(--text-dim);
  }
  .display-panel.fm .display-band{color:var(--amber); border-color:var(--amber-dim);}
  .display-panel.am .display-band{color:var(--sky); border-color:var(--sky-dim);}

  .display-body{position:relative; z-index:1;}
  .readout-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-bottom:1px solid var(--line);
    gap:10px;
  }
  .readout-row:last-child{border-bottom:none;}
  .readout-label{
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--text-dim); font-weight:700; flex-shrink:0;
  }
  .readout-value{
    font-family:var(--mono); font-weight:700; font-size:22px;
    letter-spacing:.02em; cursor:pointer; text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .display-panel.fm .readout-value{color:var(--amber); text-shadow:0 0 14px var(--amber-dim);}
  .display-panel.am .readout-value{color:var(--sky); text-shadow:0 0 14px var(--sky-dim);}
  .readout-row.emergency .readout-value{color:var(--danger)!important; text-shadow:0 0 14px var(--danger-dim)!important;}

  .chips-value-row{align-items:flex-start;}
  .value-chips{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; max-width:70%;
  }
  .value-chip{
    font-family:var(--mono); font-size:14px; font-weight:700;
    border:1px solid var(--amber-dim); color:var(--amber);
    padding:4px 9px; border-radius:var(--radius-sm); cursor:pointer;
  }
  .display-panel.am .value-chip{border-color:var(--sky-dim); color:var(--sky);}

  .display-note{
    font-size:11px; color:var(--text-dim-2); padding:8px 0 4px; position:relative; z-index:1;
  }

  /* List section */
  .list-title{
    font-family:var(--cond); font-stretch:condensed;
    font-size:14px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--text-dim); margin:4px 0 8px;
  }
  .list{display:flex; flex-direction:column; gap:8px;}
  .list-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-md); padding:12px 14px;
    cursor:pointer; text-align:left; border-left:3px solid transparent;
    transition:border-color .15s, background .15s;
  }
  .list-row.active.fm{border-left-color:var(--amber); background:var(--amber-dim);}
  .list-row.active.am{border-left-color:var(--sky); background:var(--sky-dim);}
  .list-row-name{
    font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px;
  }
  .list-row-name .home-dot{color:var(--amber); font-size:10px;}
  .list-row-data{
    font-family:var(--mono); font-size:12px; color:var(--text-dim); text-align:right;
  }
  .empty-state{
    padding:20px; text-align:center; color:var(--text-dim-2); font-size:13px;
  }

  /* Extra / disclosures */
  .extra{margin-top:22px;}
  details.disclosure{
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-md); margin-bottom:10px; overflow:hidden;
  }
  details.disclosure summary{
    padding:13px 14px; cursor:pointer; list-style:none;
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; font-weight:700; color:var(--text);
  }
  details.disclosure summary::-webkit-details-marker{display:none;}
  details.disclosure summary::after{
    content:"+"; color:var(--sky); font-size:18px; font-weight:400;
  }
  details.disclosure[open] summary::after{content:"−";}
  .disclosure-body{padding:0 14px 14px; font-size:13px; color:var(--text-dim);}
  .region-row{
    display:flex; justify-content:space-between; padding:7px 0;
    border-bottom:1px solid var(--line); font-family:var(--mono); font-size:12px;
  }
  .region-row:last-child{border-bottom:none;}
  .region-row b{color:var(--text); font-family:var(--sans); font-size:13px;}
  .pt-block{margin-bottom:12px;}
  .pt-block h4{
    margin:10px 0 4px; font-size:12px; color:var(--sky);
    text-transform:uppercase; letter-spacing:.06em;
  }
  .pt-line{display:flex; justify-content:space-between; font-family:var(--mono); font-size:12px; padding:4px 0;}

  .app-footer{text-align:center; margin-top:24px;}
  .app-footer p{font-size:11px; color:var(--text-dim-2);}

  /* Toast */
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%,12px);
    background:var(--panel-2); border:1px solid var(--line-strong);
    color:var(--text); padding:10px 18px; border-radius:999px;
    font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
    font-family:var(--mono);
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}
</style>
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="eyebrow">Agentes Medioambientales · Castilla y León</div>
    <h1>Radio de <span>Campo</span></h1>
    <p class="subtitle">Canales tierra-tierra (FM) y frecuencias banda aérea (AM)</p>
  </header>

  <nav class="tabs">
    <div class="tab-indicator" id="tabIndicator"></div>
    <button class="tab active" data-tab="fm" id="tabFm">Tierra · FM</button>
    <button class="tab" data-tab="am" id="tabAm">Aérea · AM</button>
  </nav>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Buscar provincia…" autocomplete="off">
  </div>

  <div class="chips-scroll" id="chipsScroll"></div>

  <section class="display-panel fm" id="displayPanel">
    <div class="display-header">
      <span class="display-province" id="dpProvince">SALAMANCA</span>
      <span class="display-band" id="dpBand">TIERRA · FM</span>
    </div>
    <div class="display-body" id="dpBody"></div>
    <div class="display-note" id="dpNote"></div>
  </section>

  <section class="list-section">
    <h3 class="list-title" id="listTitle">Todas las provincias</h3>
    <div class="list" id="provinceList"></div>
  </section>

  <section class="extra" id="extraSection" hidden>
    <details class="disclosure">
      <summary>Otras comunidades limítrofes</summary>
      <div class="disclosure-body" id="otherRegionsBody"></div>
    </details>
    <details class="disclosure">
      <summary>Frontera con Portugal · AFOCELCA</summary>
      <div class="disclosure-body" id="portugalBody"></div>
    </details>
  </section>

  <footer class="app-footer">
    <p>Toca cualquier valor para copiarlo</p>
  </footer>

</div>

<div class="toast" id="toast"></div>

<script>
  // ---------- Datos ----------
  const FM_DATA = {
    "Ávila":       { simplex: "2",          repetidor: ["29","30","34","35","42","43","44","45"] },
    "Burgos":      { simplex: "15",         repetidor: ["90","91","92","93","94","95","96","97","98","99","9"] },
    "León":        { simplex: "16 / 17 / 18", repetidor: ["64","67","80","81","83"] },
    "Palencia":    { simplex: "22",         repetidor: ["21","23","24","25","26","27","28","31","32","33"] },
    "Salamanca":   { simplex: "20",         repetidor: ["71","84","85","86"] },
    "Segovia":     { simplex: "1",          repetidor: ["59","61","62","63","65","66","68","69"] },
    "Soria":       { simplex: "10",         repetidor: ["74","75","76","77","78","79","87","88","89"] },
    "Valladolid":  { simplex: "7",          repetidor: ["50","51","52","53","54","55","56","60"] },
    "Zamora":      { simplex: "5 / 6",      repetidor: ["36","37","38","39","40","41","47"] },
    "Autonómicos": { simplex: "3 / 4 / 57 / 58", repetidor: [] }
  };

  const AM_DATA = {
    "Ávila":      { principal: "122,350", auxiliar: "123,425" },
    "Burgos":     { principal: "130,500", auxiliar: "130,325" },
    "León":       { principal: "130,500", auxiliar: "130,325" },
    "Palencia":   { principal: "123,425", auxiliar: "122,475" },
    "Salamanca":  { principal: "123,425", auxiliar: "122,475" },
    "Segovia":    { principal: "123,425", auxiliar: "130,325" },
    "Soria":      { principal: "122,350", auxiliar: "123,425" },
    "Valladolid": { principal: "122,475", auxiliar: "130,500" },
    "Zamora":     { principal: "130,325", auxiliar: "122,350" }
  };
  const AM_EMERGENCIA_CYL = "129,825"; // común a las 9 provincias de CyL (también Reserva)

  const OTHER_REGIONS = [
    { region:"Lugo",      principal:"122,350", emergencia:"La Rioja",    auxiliar:"122,475" },
    { region:"Orense",    principal:"123,425", emergencia:"Zaragoza",    auxiliar:"130,325" },
    { region:"Asturias",  principal:"122,475", emergencia:"Madrid",      auxiliar:"122,475" },
    { region:"Cantabria", principal:"122,350", emergencia:"Guadalajara", auxiliar:"130,500" },
    { region:"Vizcaya",   principal:"130,325", emergencia:"Toledo",      auxiliar:"130,325" },
    { region:"Álava",     principal:"123,425", emergencia:"Cáceres",     auxiliar:"130,500" }
  ];

  const PORTUGAL = [
    { titulo:"Bragança (al norte del Duero)", items:[
      { cond:"1 helicóptero ligero", freq:"126,150" },
      { cond:"2 HL o aeronaves de España", freq:"122,825" }
    ]},
    { titulo:"Guarda (al sur del Duero)", items:[
      { cond:"1 helicóptero ligero", freq:"125,800" },
      { cond:"2 helicópteros o aeronaves de España", freq:"124,950" }
    ]}
  ];
  const AFOCELCA = { titulo:"AFOCELCA (Bragança y Guarda) — 3 o más HL y/o medios estatales pesados", items:[
    { cond:"Primaria", freq:"129,950" },
    { cond:"Secundaria", freq:"129,625" },
    { cond:"Terciaria", freq:"123,050" }
  ]};

  const HOME_PROVINCE = "Salamanca";

  // ---------- Estado ----------
  let state = { tab: "fm", province: "Salamanca", search: "" };

  // ---------- Utilidades ----------
  function normalize(s){
    return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  }
  function currentData(){ return state.tab === "fm" ? FM_DATA : AM_DATA; }
  function provinceKeys(){
    return Object.keys(currentData()).filter(p => normalize(p).includes(normalize(state.search)));
  }
  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove("show"), 1400);
  }
  function copyValue(val){
    const text = String(val);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>showToast("Copiado: " + text))
        .catch(()=>showToast(text));
    } else {
      showToast(text);
    }
  }
  function selectProvince(p){
    state.province = p;
    renderAll();
    document.getElementById("displayPanel").scrollIntoView({behavior:"smooth", block:"start"});
  }

  // ---------- Render: Tabs ----------
  function setTab(tab){
    state.tab = tab;
    // si la provincia actual no existe en la nueva pestaña, usar Salamanca
    if(!currentData()[state.province]) state.province = HOME_PROVINCE;
    document.getElementById("tabFm").classList.toggle("active", tab==="fm");
    document.getElementById("tabAm").classList.toggle("active", tab==="am");
    const indicator = document.getElementById("tabIndicator");
    indicator.style.transform = tab==="fm" ? "translateX(0)" : "translateX(100%)";
    indicator.style.background = tab==="fm" ? "var(--amber)" : "var(--sky)";
    document.getElementById("extraSection").hidden = (tab !== "am");
    renderAll();
  }

  // ---------- Render: Chips ----------
  function renderChips(){
    const wrap = document.getElementById("chipsScroll");
    wrap.innerHTML = "";
    provinceKeys().forEach(p => {
      const chip = document.createElement("button");
      chip.className = "prov-chip" + (p === state.province ? " selected " + state.tab : "");
      chip.innerHTML = (p === HOME_PROVINCE ? '<span class="home-dot">●</span> ' : '') + p;
      chip.addEventListener("click", () => selectProvince(p));
      wrap.appendChild(chip);
    });
  }

  // ---------- Render: Display panel ----------
  function renderDisplay(){
    const panel = document.getElementById("displayPanel");
    panel.classList.remove("fm","am");
    panel.classList.add(state.tab);
    document.getElementById("dpProvince").textContent = state.province.toUpperCase();
    document.getElementById("dpBand").textContent = state.tab === "fm" ? "TIERRA · FM" : "AÉREA · AM";
    const body = document.getElementById("dpBody");
    const note = document.getElementById("dpNote");
    body.innerHTML = "";
    note.textContent = "";

    if(state.tab === "fm"){
      const d = FM_DATA[state.province];
      if(!d) return;
      body.innerHTML = `
        <div class="readout-row">
          <span class="readout-label">Simplex (directo)</span>
          <span class="readout-value" data-copy="${d.simplex}">${d.simplex}</span>
        </div>
        <div class="readout-row chips-value-row">
          <span class="readout-label">Semiduplex (repetidor)</span>
          <div class="value-chips">
            ${d.repetidor.length ? d.repetidor.map(c => `<span class="value-chip" data-copy="${c}">${c}</span>`).join("") : '<span style="color:var(--text-dim-2); font-size:12px;">— sin repetidor —</span>'}
          </div>
        </div>`;
    } else {
      const d = AM_DATA[state.province];
      if(!d) return;
      body.innerHTML = `
        <div class="readout-row">
          <span class="readout-label">Principal</span>
          <span class="readout-value" data-copy="${d.principal}">${d.principal}</span>
        </div>
        <div class="readout-row">
          <span class="readout-label">Auxiliar</span>
          <span class="readout-value" data-copy="${d.auxiliar}">${d.auxiliar}</span>
        </div>
        <div class="readout-row emergency">
          <span class="readout-label">Emergencias / Reserva</span>
          <span class="readout-value" data-copy="${AM_EMERGENCIA_CYL}">${AM_EMERGENCIA_CYL}</span>
        </div>`;
      note.textContent = "Frecuencia de emergencias común a las 9 provincias de Castilla y León.";
    }

    body.querySelectorAll("[data-copy]").forEach(el=>{
      el.addEventListener("click", ()=> copyValue(el.dataset.copy));
    });
  }

  // ---------- Render: List ----------
  function renderList(){
    document.getElementById("listTitle").textContent =
      state.tab === "fm" ? "Todas las provincias · FM" : "Todas las provincias · AM";
    const list = document.getElementById("provinceList");
    list.innerHTML = "";
    const keys = provinceKeys();
    if(keys.length === 0){
      list.innerHTML = '<div class="empty-state">No hay provincias que coincidan con la búsqueda.</div>';
      return;
    }
    keys.forEach(p=>{
      const row = document.createElement("button");
      row.className = "list-row" + (p === state.province ? " active " + state.tab : "");
      let dataHtml;
      if(state.tab === "fm"){
        const d = FM_DATA[p];
        dataHtml = `Simplex ${d.simplex}${d.repetidor.length ? " · Rep " + d.repetidor.join(",") : ""}`;
      } else {
        const d = AM_DATA[p];
        dataHtml = `Pr ${d.principal} · Aux ${d.auxiliar}`;
      }
      row.innerHTML = `
        <span class="list-row-name">${p === HOME_PROVINCE ? '<span class="home-dot">●</span>' : ''}${p}</span>
        <span class="list-row-data">${dataHtml}</span>`;
      row.addEventListener("click", ()=> selectProvince(p));
      list.appendChild(row);
    });
  }

  // ---------- Render: Extra (solo AM) ----------
  function renderExtra(){
    const otherBody = document.getElementById("otherRegionsBody");
    otherBody.innerHTML = OTHER_REGIONS.map(r => `
      <div class="region-row">
        <b>${r.region}</b>
        <span>Pr ${r.principal} · Em → ${r.emergencia} · Aux ${r.auxiliar}</span>
      </div>`).join("");

    const ptBody = document.getElementById("portugalBody");
    let html = PORTUGAL.map(block => `
      <div class="pt-block">
        <h4>${block.titulo}</h4>
        ${block.items.map(i => `<div class="pt-line"><span>${i.cond}</span><span>${i.freq}</span></div>`).join("")}
      </div>`).join("");
    html += `
      <div class="pt-block">
        <h4>${AFOCELCA.titulo}</h4>
        ${AFOCELCA.items.map(i => `<div class="pt-line"><span>${i.cond}</span><span>${i.freq}</span></div>`).join("")}
      </div>`;
    ptBody.innerHTML = html;
  }

  // ---------- Render all ----------
  function renderAll(){
    renderChips();
    renderDisplay();
    renderList();
    if(state.tab === "am") renderExtra();
  }

  // ---------- Eventos ----------
  document.getElementById("tabFm").addEventListener("click", ()=>setTab("fm"));
  document.getElementById("tabAm").addEventListener("click", ()=>setTab("am"));
  document.getElementById("searchInput").addEventListener("input", (e)=>{
    state.search = e.target.value;
    renderChips();
    renderList();
  });

  // ---------- Inicio ----------
  setTab("fm");
</script>
</body>
</html>
